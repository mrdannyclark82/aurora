<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura - Predictive Life Assistant</title>
    <link rel="manifest" href="/manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'primary': '#0D1117',
              'secondary': '#161B22',
              'accent': '#58A6FF',
              'border': '#30363D',
              'text-primary': '#C9D1D9',
              'text-secondary': '#8B949E',
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 3s linear infinite',
              'fade-in': 'fadeIn 0.5s ease-in-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
            }
          }
        }
      }
    </script>
    <style>
      .markdown-content h1, .markdown-content h2, .markdown-content h3 { margin-top: 1em; margin-bottom: 0.5em; line-height: 1.25; font-weight: 600; }
      .markdown-content h1 { font-size: 1.5em; }
      .markdown-content h2 { font-size: 1.25em; }
      .markdown-content h3 { font-size: 1.1em; }
      .markdown-content p { margin-bottom: 0.75em; }
      .markdown-content ul, .markdown-content ol { margin-left: 1.5em; margin-bottom: 1em; }
      .markdown-content ul { list-style-type: disc; }
      .markdown-content ol { list-style-type: decimal; }
      .markdown-content li { margin-bottom: 0.25em; }
      .markdown-content code { background-color: #161B22; padding: 0.2em 0.4em; margin: 0; font-size: 85%; border-radius: 6px; }
      .markdown-content pre { background-color: #161B22; padding: 1em; border-radius: 6px; overflow-x: auto; }
      .markdown-content pre code { padding: 0; background-color: transparent; }
      .markdown-content a { color: #58A6FF; text-decoration: underline; }
      .markdown-content table { width: 100%; border-collapse: collapse; margin-bottom: 1em; }
      .markdown-content th, .markdown-content td { border: 1px solid #30363D; padding: 0.5em 0.75em; }
      .markdown-content th { font-weight: 600; background-color: #161B22; }
      .markdown-content blockquote { border-left: 0.25em solid #30363D; padding-left: 1em; margin-left: 0; color: #8B949E; }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1",
    "remark-gfm": "https://esm.sh/remark-gfm@4.0.0",
    "@testing-library/react": "https://aistudiocdn.com/@testing-library/react@^16.3.0",
    "vitest": "https://aistudiocdn.com/vitest@^4.0.7",
    "diff": "https://aistudiocdn.com/diff@^8.0.2",
    "react-diff-view/": "https://aistudiocdn.com/react-diff-view@^3.3.2/",
    "react-diff-view": "https://aistudiocdn.com/react-diff-view@^3.3.2"
  }
}
</script>
</head>
  <body class="bg-primary">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
